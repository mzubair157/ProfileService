spring.application.name=ProfileService
spring.datasource.url=jdbc:h2:file:./data/profiles;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.sql.init.mode=always
spring.h2.console.enabled=true
spring.cache.cache-names=profiles,loyalty,discounts,favorites
security.jwt.secret=VGhpc0lzQVN1ZmZpY2llbnRseUxvbmdEZW1vU2VjcmV0S2V5Rm9ySFMyNTY=
recommendation.client.base-url=http://ai-service
recommendation.client.connect-timeout=500ms
recommendation.client.read-timeout=1200ms
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=always

# Fix credentials to avoid using generated passwords from logs
spring.security.user.name=admin
spring.security.user.password=password123
